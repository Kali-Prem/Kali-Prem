<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 78" role="img" aria-label="Connect With Me">
  <defs>
    <linearGradient id="bg-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b10"/>
      <stop offset="100%" stop-color="#2d1018"/>
    </linearGradient>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="7" width="884" height="64" rx="16" fill="url(#bg-red)" stroke="#ff4d6d" stroke-width="2.2" filter="url(#glow-red)"/>
  <rect x="20" y="15" width="860" height="48" rx="12" fill="#180b10" opacity="0.9"/>
  <circle cx="48" cy="39" r="5.5" fill="#ff4d6d"/>
  <circle cx="68" cy="39" r="5.5" fill="#ff6f8b"/>
  <circle cx="88" cy="39" r="5.5" fill="#ff93a7"/>
  <text x="50%" y="36" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" fill="#ff4d6d" font-weight="700">Connect With Me</text>
  <text x="50%" y="53" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12.5" fill="#ffb2c0">LinkedIn • LeetCode • TryHackMe • Email</text>
</svg>
