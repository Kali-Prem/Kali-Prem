<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 78" role="img" aria-label="GitHub Insights">
  <defs>
    <linearGradient id="bg-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131d"/>
      <stop offset="100%" stop-color="#10253a"/>
    </linearGradient>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="7" width="884" height="64" rx="16" fill="url(#bg-cyan)" stroke="#00f5ff" stroke-width="2.2" filter="url(#glow-cyan)"/>
  <rect x="20" y="15" width="860" height="48" rx="12" fill="#07131d" opacity="0.9"/>
  <circle cx="48" cy="39" r="5.5" fill="#00f5ff"/>
  <circle cx="68" cy="39" r="5.5" fill="#00c2d6"/>
  <circle cx="88" cy="39" r="5.5" fill="#00ffcc"/>
  <text x="50%" y="36" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" fill="#00f5ff" font-weight="700">GitHub Insights</text>
  <text x="50%" y="53" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12.5" fill="#7ef9ff">Live stats • coding activity • neon terminal vibe</text>
</svg>
