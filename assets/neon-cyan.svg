<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 140" role="img" aria-label="GitHub Insights">
  <defs>
    <linearGradient id="bg-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131d"/>
      <stop offset="100%" stop-color="#10253a"/>
    </linearGradient>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="884" height="124" rx="22" fill="url(#bg-cyan)" stroke="#00f5ff" stroke-width="2.4" filter="url(#glow-cyan)"/>
  <rect x="28" y="28" width="844" height="84" rx="16" fill="#07131d" opacity="0.9"/>
  <circle cx="58" cy="70" r="7" fill="#00f5ff"/>
  <circle cx="82" cy="70" r="7" fill="#00c2d6"/>
  <circle cx="106" cy="70" r="7" fill="#00ffcc"/>
  <text x="50%" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#00f5ff" font-weight="700">GitHub Insights</text>
  <text x="50%" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7ef9ff">Live stats • coding activity • neon terminal vibe</text>
</svg>