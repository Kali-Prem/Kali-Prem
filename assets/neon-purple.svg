<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 78" role="img" aria-label="Tech Stack">
  <defs>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110a1f"/>
      <stop offset="100%" stop-color="#221045"/>
    </linearGradient>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="7" width="884" height="64" rx="16" fill="url(#bg-purple)" stroke="#7c4dff" stroke-width="2.2" filter="url(#glow-purple)"/>
  <rect x="20" y="15" width="860" height="48" rx="12" fill="#110a1f" opacity="0.9"/>
  <circle cx="48" cy="39" r="5.5" fill="#7c4dff"/>
  <circle cx="68" cy="39" r="5.5" fill="#8f63ff"/>
  <circle cx="88" cy="39" r="5.5" fill="#a886ff"/>
  <text x="50%" y="36" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" fill="#7c4dff" font-weight="700">Tech Stack</text>
  <text x="50%" y="53" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12.5" fill="#c7b2ff">Java • Python • Web • Security • Cloud</text>
</svg>
