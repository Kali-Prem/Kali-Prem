<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 140" role="img" aria-label="Tech Stack">
  <defs>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110a1f"/>
      <stop offset="100%" stop-color="#221045"/>
    </linearGradient>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="884" height="124" rx="22" fill="url(#bg-purple)" stroke="#7c4dff" stroke-width="2.4" filter="url(#glow-purple)"/>
  <rect x="28" y="28" width="844" height="84" rx="16" fill="#110a1f" opacity="0.9"/>
  <circle cx="58" cy="70" r="7" fill="#7c4dff"/>
  <circle cx="82" cy="70" r="7" fill="#8f63ff"/>
  <circle cx="106" cy="70" r="7" fill="#a886ff"/>
  <text x="50%" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#7c4dff" font-weight="700">Tech Stack</text>
  <text x="50%" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c7b2ff">Java • Python • Web • Security • Cloud</text>
